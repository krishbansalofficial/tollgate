# App-of-apps root. Applied once by infra/bootstrap.sh; from then on every
# change reaches the cluster through git (Argo CD watches deploy/apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:krishbansalofficial/tollgate.git
    targetRevision: main
    path: deploy/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
