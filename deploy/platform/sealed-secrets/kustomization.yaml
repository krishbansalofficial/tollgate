# Upstream release manifest, pinned. Encrypts Secrets with the controller's
# key so the encrypted SealedSecret can be committed; only the cluster can
# decrypt it. No external secret store, so it stays $0.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.41.2/controller.yaml
