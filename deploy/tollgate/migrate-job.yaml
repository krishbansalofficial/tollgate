# Runs `tollgate migrate` before every sync (Argo CD PreSync hook), so the
# schema is updated exactly once per rollout, before new pods start, rather
# than racing from every pod's startup.
apiVersion: batch/v1
kind: Job
metadata:
  name: tollgate-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: tollgate, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/krishbansalofficial/tollgate
          args: [migrate]
          env:
            - name: TOLLGATE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: tollgate-secrets, key: database-url } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
