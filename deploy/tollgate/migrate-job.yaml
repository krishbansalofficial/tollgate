# Runs `tollgate migrate` once per sync, before new pods start, rather than
# racing from every pod's startup. It is a Sync hook in wave 1, not PreSync:
# PreSync runs before any normal resource is applied, so on a first deploy
# the SealedSecret and Postgres (wave 0) would not exist yet and the job
# would wait forever. Argo CD waits for wave 0 to be healthy, runs this job
# to completion, then applies the Deployment (wave 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: tollgate-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: tollgate, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/krishbansalofficial/tollgate
          args: [migrate]
          env:
            - name: TOLLGATE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: tollgate-secrets, key: database-url } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
