# NOT applied and never filled in here. Documents the Secrets the manifests
# expect. scripts/seal-secrets.sh builds them from your shell, encrypts them
# with the cluster's sealed-secrets key, and writes sealed-secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: tollgate-secrets
  namespace: tollgate
stringData:
  postgres-password: "<random>"
  database-url: "postgres://tollgate:<same random>@postgres:5432/tollgate?sslmode=disable"
  groq-api-key: "<optional>"
  anthropic-api-key: "<optional>"
  gemini-api-key: "<optional>"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: tollgate
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"<base64 user:read-packages-token>"}}}'
