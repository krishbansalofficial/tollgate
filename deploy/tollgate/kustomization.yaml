apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tollgate

resources:
  - sealed-secrets.yaml
  - namespace.yaml
  - tollgate.yaml
  - migrate-job.yaml
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
  # Secrets: generated per cluster by scripts/seal-secrets.sh, which encrypts
  # them with this cluster's sealed-secrets key and adds the file here.
  # See secrets.example.yaml for the keys it must contain.

# On main this pin is only a placeholder. CI writes the real tag and digest
# on the bot-owned `deploy` branch (the built commit + one pin commit), which
# Argo CD's tollgate app tracks, so main never gets bot commits. Don't edit.
images:
  - name: ghcr.io/krishbansalofficial/tollgate
    newTag: sha-459b24248a5b
    digest: sha256:61c77794b91c12f31cbd674ade27c6843fd01ace1ac129e200efe326eaabb595

configMapGenerator:
  - name: tollgate-config
    literals:
      - TOLLGATE_REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector.observability.svc.cluster.local:4317
      - TOLLGATE_RATELIMIT_FAIL_MODE=open
      # Ollama on the laptop, reached over Tailscale (see docs/DEPLOY.md).
      # Leave empty to run without a local fallback.
      - TOLLGATE_OLLAMA_BASE_URL=
      - TOLLGATE_FALLBACK_MODEL=
