# Redis holds only ephemeral state: rate-limit buckets and cached responses.
# No persistence: after a restart buckets read as full and the cache is cold,
# both of which are safe. Every key has a TTL, so volatile-lru evicts only
# expirable keys under memory pressure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          args: [--maxmemory, 96mb, --maxmemory-policy, volatile-lru, --save, "", --appendonly, "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 160Mi }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
