# Default-deny ingress for the namespace, then allow only the paths in use.
# (k3s enforces NetworkPolicy with its embedded kube-router controller.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# API: from Traefik (kube-system) on 8080, Prometheus (observability) on 9090.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tollgate-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tollgate, app.kubernetes.io/component: api }
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 8080 }]
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } } }]
      ports: [{ port: 9090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: tollgate } } }] # api + migrate job
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: tollgate, app.kubernetes.io/component: api } } }]
      ports: [{ port: 6379 }]
---
# cert-manager's HTTP-01 solver pods run in this namespace for a minute while
# Let's Encrypt validates the domain. Without this, default-deny blocks
# Traefik from reaching them and issuance stalls on a 502.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01-solver
spec:
  podSelector:
    matchLabels: { acme.cert-manager.io/http01-solver: "true" }
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 8089 }]
