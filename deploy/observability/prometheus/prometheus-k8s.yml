# In-cluster variant of prometheus.yml: discovers each gateway pod directly.
# Scraping through a Service would load-balance scrapes across replicas, so
# successive samples would come from different pods and counters would jump.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tollgate
    kubernetes_sd_configs:
      - role: pod
        namespaces: { names: [tollgate] }
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: tollgate;api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
